<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categoria | Sem Censura</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {

            --bg: #0d0d0d;
            --card: #161616;
            --primary: #ff2e88;
            --gold: #d4af37;
            --text: #d1d1d1;
            --border: rgba(255, 255, 255, .08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: var(--bg);
            color: white;

            font-family: Poppins, sans-serif;

            padding-bottom: 100px;
        }

        .container {

            max-width: 1300px;
            margin: auto;

            padding: 20px;
        }

        /* ===================================== */
        /* TOP */
        /* ===================================== */

        .category-top {

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 24px;

            gap: 16px;
        }

        .category-title {

            font-size: 2rem;
        }

        /* ===================================== */
        /* PRODUCT MODAL */
        /* ===================================== */

        .product-modal {

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .7);

            display: none;

            z-index: 999999;

            padding: 20px;
        }

        .product-modal-content {

            background: #161616;

            border-radius: 30px;

            padding: 20px;

            max-width: 500px;

            margin: auto;

            margin-top: 40px;

            position: relative;
        }

        .modal-product-image {

            width: 100%;

            height: 320px;

            object-fit: contain;

            background: #111;

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 20px;
        }

        .modal-product-title {

            font-size: 1.3rem;

            margin-bottom: 12px;
        }

        .modal-product-description {

            color: #bbb;

            line-height: 1.7;

            margin-bottom: 20px;
        }

        .modal-product-price {

            font-size: 1.7rem;

            font-weight: 700;

            color: var(--gold);

            margin-bottom: 20px;
        }

        /* ===================================== */
        /* MOBILE NAV */
        /* ===================================== */

        .mobile-nav {

            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 72px;

            background: #111;

            border-top:
                1px solid var(--border);

            display: flex;

            justify-content: space-around;
            align-items: center;

            z-index: 999999;
        }

        .mobile-nav a,
        .mobile-nav button {

            background: none;
            border: none;

            color: #aaa;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 4px;

            font-size: .75rem;

            cursor: pointer;

            text-decoration: none;

            font-family: Poppins, sans-serif;
        }

        .mobile-nav i {

            font-size: 1.2rem;
        }

        .mobile-nav a:hover,
        .mobile-nav button:hover {

            color: var(--primary);
        }

        /* ===================================== */
        /* SEARCH */
        /* ===================================== */

        .search-box {

            height: 56px;

            background: var(--card);

            border-radius: 18px;

            display: flex;
            align-items: center;

            padding: 0 18px;

            gap: 14px;

            border: 1px solid var(--border);

            margin-bottom: 18px;
        }

        .search-box input {

            background: none;
            border: none;
            outline: none;

            width: 100%;

            color: white;

            font-family: Poppins, sans-serif;

            font-size: 1rem;
        }

        /* ===================================== */
        /* FILTERS */
        /* ===================================== */

        .filters {

            display: flex;
            gap: 12px;

            margin-bottom: 24px;

            overflow-x: auto;
        }

        .filter-select {

            height: 48px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 0 14px;

            color: white;

            outline: none;
        }

        /* ===================================== */
        /* PRODUCTS */
        /* ===================================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 18px;
        }

        .product-card {

            background: var(--card);

            border-radius: 24px;

            overflow: hidden;

            cursor: pointer;

            transition: .3s;

            border: 1px solid var(--border);
        }

        .product-card:hover {

            transform: translateY(-5px);
        }

        .product-image {

            height: 240px;

            background: #111;
        }

        .product-image img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 14px;
        }

        .product-content {

            padding: 16px;
        }

        .product-title {

            font-size: .95rem;

            margin-bottom: 12px;

            min-height: 48px;
        }

        .price {

            font-size: 1.3rem;
            font-weight: 700;

            color: var(--gold);
        }

        button,
        a,
        div {

            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===================================== */
        /* BACK BUTTON */
        /* ===================================== */

        .back-button {

            height: 48px;

            padding: 0 18px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 14px;

            display: flex;
            align-items: center;

            gap: 10px;

            color: white;

            font-weight: 600;

            transition: .3s;
        }

        .back-button:hover {

            background: var(--primary);

            transform: translateY(-2px);
        }

        .back-button i {

            font-size: .95rem;
        }

        /* ===================================== */
        /* MOBILE */
        /* ===================================== */

        @media(max-width:768px) {

            .products-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .product-image {
                height: 180px;
            }

            .category-title {
                font-size: 1.5rem;
            }

        }

        /* ===================================== */
        /* CART */
        /* ===================================== */

        .cart-overlay {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .6);

            backdrop-filter: blur(5px);

            display: none;

            z-index: 999999;
        }

        .cart-overlay.active {
            display: block;
        }

        .cart-sidebar {

            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 85vh;

            background: #111;

            border-radius: 30px 30px 0 0;

            display: flex;
            flex-direction: column;

            transform: translateY(100%);

            transition: .35s;
        }

        .cart-overlay.active .cart-sidebar {

            transform: translateY(0);
        }

        /* HEADER */

        .cart-header {

            padding: 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid var(--border);
        }

        /* ITEMS */

        .cart-items {

            flex: 1;

            overflow-y: auto;

            padding: 20px;
        }

        .cart-item {

            display: flex;

            gap: 14px;

            background: #161616;

            border-radius: 20px;

            padding: 14px;

            margin-bottom: 16px;
        }

        .cart-item img {

            width: 80px;
            height: 80px;

            object-fit: contain;

            background: #0d0d0d;

            border-radius: 16px;

            padding: 8px;
        }

        .cart-info {

            flex: 1;
        }

        .cart-info h4 {

            font-size: .92rem;

            margin-bottom: 8px;
        }

        .cart-info p {

            color: var(--gold);

            font-weight: 700;

            margin-bottom: 10px;
        }

        /* QUANTITY */

        .quantity {

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .quantity button {

            width: 32px;
            height: 32px;

            border: none;

            border-radius: 12px;

            background: #222;

            color: white;

            cursor: pointer;

            transition: .3s;
        }

        .quantity button:hover {

            background: var(--primary);
        }

        /* FOOTER */

        .cart-footer {

            padding: 20px;

            border-top:
                1px solid var(--border);

            background: #111;
        }

        .cart-total {

            display: flex;
            justify-content: space-between;

            margin-bottom: 18px;

            font-size: 1.1rem;
            font-weight: 700;
        }

        /* CHECKOUT BUTTON */

        .checkout-button {

            width: 100%;

            height: 56px;

            border: none;

            border-radius: 18px;

            background:
                linear-gradient(135deg,
                    #25D366,
                    #1ebe5b);

            color: white;

            font-size: 1rem;
            font-weight: 700;

            font-family: Poppins, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            cursor: pointer;

            transition: .3s;
        }

        .checkout-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.05);
        }

        /* CLOSE BUTTON */

        .close-cart {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 14px;

            background: #1f1f1f;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: .3s;
        }

        .close-cart:hover {

            background: var(--primary);

            transform: rotate(90deg);
        }

        /* TOAST */

        .toast {

            position: fixed;

            bottom: 90px;
            left: 50%;

            transform: translateX(-50%);

            background: var(--primary);

            color: white;

            padding: 14px 20px;

            border-radius: 14px;

            font-weight: 600;

            opacity: 0;

            pointer-events: none;

            transition: .3s;

            z-index: 9999999;
        }

        /* ADD CART BUTTON */

        .add-cart-button {

            width: 100%;

            height: 58px;

            border: none;

            border-radius: 18px;

            background: var(--primary);

            color: white;

            font-size: 1rem;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-top: 20px;

            cursor: pointer;

            font-family: Poppins, sans-serif;

            transition: .3s;
        }

        .add-cart-button:hover {

            transform: translateY(-2px);
        }

        /* MODAL */

        .product-modal-content {

            max-height: 85vh;

            overflow-y: auto;

            padding-bottom: 120px;
        }

        .toast.show {

            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="category-top">

            <a href="index.html" class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Voltar

            </a>

            <h1 class="category-title" id="category-title">
                Categoria
            </h1>

        </div>

        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" placeholder="Pesquisar produto..." id="search-input">

        </div>

        <!-- FILTERS -->

        <div class="filters">

            <select class="filter-select" id="price-filter">

                <option value="">
                    Preço
                </option>

                <option value="0-50">
                    Até R$50
                </option>

                <option value="50-100">
                    R$50 - R$100
                </option>

                <option value="100-9999">
                    Acima de R$100
                </option>

            </select>


        </div>

        <!-- PRODUCTS -->

        <div class="products-grid" id="products-grid"></div>

    </div>

    <script>
        let cart =
            JSON.parse(
                localStorage.getItem('cart')
            ) || [];
        let currentProducts = [];
        let selectedProduct = null;
        const API_BASE =
            'https://semcensura-loja.onrender.com';


        const params = new URLSearchParams(window.location.search);

        const categoria = params.get('categoria');

        const categoriaMap = {
            paraela: 'paraela',
            paraele: 'paraele',
            paracasal: 'casal'
        };

        const categoriaFinal =
            categoriaMap[categoria];

        document.getElementById(
            'category-title'
        ).innerText = categoria;

        let produtos = [];

        async function carregarProdutos() {

            const response =
                await fetch(
                    `${API_BASE}/api/produtos`
                );

            const data =
                await response.json();

            produtos =
                data.filter(p =>

                    p.categoria?.toLowerCase()
                    === categoriaFinal?.toLowerCase()

                );

            renderProdutos(produtos);

        }
        function addCurrentProductToCart() {

            if (!selectedProduct) return;

            addToCart(selectedProduct);

        }
        function renderProdutos(lista) {

            const grid =
                document.getElementById(
                    'products-grid'
                );

            grid.innerHTML = '';
            currentProducts = lista;
            lista.forEach((product, index) => {

                grid.innerHTML += `

<div
class="product-card"
onclick="openProductModalByIndex(${index})"
>

<div class="product-image">

<img src="${product.imagem}">

</div>

<div class="product-content">

<h3 class="product-title">
${product.nome}
</h3>

<div class="price">

R$ ${Number(product.preco)
                        .toFixed(2)
                        .replace('.', ',')}

</div>

</div>

</div>

`;

            });

        }

        // =====================================
        // SEARCH
        // =====================================

        document
            .getElementById('search-input')
            .addEventListener(
                'input',
                function () {

                    const termo =
                        this.value.toLowerCase();

                    const filtrados =
                        produtos.filter(p =>

                            p.nome
                                .toLowerCase()
                                .includes(termo)

                        );

                    renderProdutos(filtrados);

                }
            );

        // =====================================
        // FILTER PRICE
        // =====================================

        document
            .getElementById('price-filter')
            .addEventListener(
                'change',
                applyFilters
            );


        function applyFilters() {

            const price =
                document.getElementById(
                    'price-filter'
                ).value;

            let filtrados = [...produtos];

            if (price) {

                const [min, max] =
                    price.split('-').map(Number);

                filtrados =
                    filtrados.filter(p =>

                        p.preco >= min &&
                        p.preco <= max

                    );

            }

            renderProdutos(filtrados);

        }
        function openProductModalByIndex(index) {

            const product =
                currentProducts[index];

            openProductModal(product);

        }

        // =====================================
        // PRODUCT MODAL
        // =====================================

        function openProductModal(product) {

            selectedProduct = product;

            const modal =
                document.getElementById(
                    'product-modal'
                );

            const content =
                document.getElementById(
                    'product-modal-content'
                );

            content.innerHTML = `

            <img
            src="${product.imagem}"
            class="modal-product-image"
            >

            <h2 class="modal-product-title">
            ${product.nome}
            </h2>

            <p class="modal-product-description">
            ${product.descricao || 'Produto premium.'}
            </p>

            <div class="modal-product-price">

            R$ ${Number(product.preco)
                    .toFixed(2)
                    .replace('.', ',')}

            </div>

            <button
            class="add-cart-button"
            onclick="addCurrentProductToCart()"
            >

            <i class="fa-solid fa-cart-shopping"></i>

            Adicionar ao Carrinho

            </button>

            `;

            modal.style.display = 'block';
        }

        function closeProductModal() {

            document.getElementById(
                'product-modal'
            ).style.display = 'none';
        }
        // =====================================
        // TOGGLE CART
        // =====================================

        function toggleCart() {

            const overlay =
                document.getElementById(
                    'cart-overlay'
                );

            if (
                overlay.style.display === 'block'
            ) {

                overlay.classList.remove('active');

                setTimeout(() => {

                    overlay.style.display = 'none';

                }, 300);

            } else {

                overlay.style.display = 'block';

                setTimeout(() => {

                    overlay.classList.add('active');

                }, 10);

            }

        }

        // =====================================
        // ADD CART
        // =====================================

        function addToCart(product) {

            const existing =
                cart.find(item =>
                    item._id === product._id
                );

            if (existing) {

                existing.quantidade++;

            } else {

                cart.push({
                    ...product,
                    quantidade: 1
                });

            }

            saveCart();

            updateCart();

            updateCartCount();

            showToast(
                'Produto adicionado'
            );

        }

        function saveCart() {

            localStorage.setItem(
                'cart',
                JSON.stringify(cart)
            );

        }
        function saveCart() {

            localStorage.setItem(
                'cart',
                JSON.stringify(cart)
            );

        }
        // =====================================
        // UPDATE CART
        // =====================================

        function updateCart() {

            const cartItems =
                document.getElementById(
                    'cart-items'
                );

            const cartTotal =
                document.getElementById(
                    'cart-total'
                );

            if (cart.length === 0) {

                cartItems.innerHTML = `
<p style="color:#999">
Seu carrinho está vazio.
</p>
`;

                cartTotal.innerText =
                    'R$ 0,00';

                return;
            }

            let total = 0;

            cartItems.innerHTML = '';

            cart.forEach(item => {

                total +=
                    item.preco * item.quantidade;

                cartItems.innerHTML += `

<div class="cart-item">

<img src="${item.imagem}">

<div class="cart-info">

<h4>${item.nome}</h4>

<p>

R$ ${(item.preco * item.quantidade)
                        .toFixed(2)
                        .replace('.', ',')}

</p>

<div class="quantity">

<button
onclick="decreaseQuantity('${item._id}')"
>
-
</button>

<span>${item.quantidade}</span>

<button
onclick="increaseQuantity('${item._id}')"
>
+
</button>

</div>

</div>

</div>

`;

            });

            cartTotal.innerText =

                `R$ ${total
                    .toFixed(2)
                    .replace('.', ',')}`;

        }

        // =====================================
        // INCREASE
        // =====================================
        function increaseQuantity(id) {

            const item =
                cart.find(i => i._id === id);

            if (item) {

                item.quantidade++;

                saveCart();

                updateCart();

                updateCartCount();

            }

        }

        // =====================================
        // DECREASE
        // =====================================

        function decreaseQuantity(id) {

            const item =
                cart.find(i => i._id === id);

            if (!item) return;

            item.quantidade--;

            if (item.quantidade <= 0) {

                cart =
                    cart.filter(
                        i => i._id !== id
                    );

            }
            saveCart();

            updateCart();

            updateCartCount();

        }

        // =====================================
        // CHECKOUT
        // =====================================

        function checkoutWhatsApp() {

            if (cart.length === 0) {

                return;

            }

            let message =
                '🛍️ *NOVO PEDIDO*%0A%0A';

            let total = 0;

            cart.forEach(item => {

                const subtotal =
                    item.preco * item.quantidade;

                total += subtotal;

                message +=

                    `• ${item.nome} x${item.quantidade}
= R$ ${subtotal
                        .toFixed(2)
                        .replace('.', ',')}%0A`;

            });

            message +=

                `%0A💰 Total:
R$ ${total
                    .toFixed(2)
                    .replace('.', ',')}`;

            window.open(

                `https://wa.me/5581975070904?text=${message}`,

                '_blank'

            );

        }
        function showToast(message) {

            const toast =
                document.getElementById('toast');

            toast.innerText = message;

            toast.classList.add('show');

            setTimeout(() => {

                toast.classList.remove('show');

            }, 2500);

        }
        function updateCartCount() {

            const count =
                cart.reduce(
                    (total, item) =>
                        total + item.quantidade,
                    0
                );

            const badge =
                document.getElementById('cart-count');

            if (badge) {

                badge.innerText = count;

                badge.style.display =
                    count > 0 ? 'flex' : 'none';
            }
        }
        window.onload = () => {

            cart =
                JSON.parse(
                    localStorage.getItem('cart')
                ) || [];

            updateCart();

            updateCartCount();

            carregarProdutos();
        };
    </script>
    <!-- PRODUCT MODAL -->

    <div class="product-modal" id="product-modal">

        <div class="product-modal-content">

            <button class="close-cart" onclick="closeProductModal()">

                <i class="fa-solid fa-xmark"></i>

            </button>

            <div id="product-modal-content"></div>

        </div>

    </div>
    <!-- MOBILE NAV -->

    <div class="mobile-nav">

        <a href="index.html">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>

        <a href="#search-input">

            <i class="fa-solid fa-magnifying-glass"></i>

            <span>Pesquisa</span>

        </a>

        <button onclick="toggleCart()" class="cart-button">

            <div style="position:relative;">

                <i class="fa-solid fa-bag-shopping"></i>

                <span id="cart-count" style="
            position:absolute;
            top:-8px;
            right:-10px;
            background:#ff2e88;
            color:white;
            width:18px;
            height:18px;
            border-radius:50%;
            font-size:.7rem;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
        ">0</span>

            </div>

            <span>Carrinho</span>

        </button>

        <a href="https://wa.me/5581975070904" target="_blank">

            <i class="fab fa-whatsapp"></i>

            <span>Whats</span>

        </a>

    </div>
    <!-- CART -->

    <div class="cart-overlay" id="cart-overlay">

        <div class="cart-sidebar">

            <div class="cart-header">

                <h3>Seu Carrinho</h3>

                <button class="close-cart" onclick="toggleCart()">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <div class="cart-items" id="cart-items">

                <p style="color:#999">
                    Seu carrinho está vazio.
                </p>

            </div>

            <div class="cart-footer">

                <div class="cart-total">

                    <span>Total</span>

                    <span id="cart-total">
                        R$ 0,00
                    </span>

                </div>

                <button class="checkout-button" onclick="checkoutWhatsApp()">

                    <i class="fab fa-whatsapp"></i>

                    Finalizar no WhatsApp

                </button>

            </div>

        </div>

    </div>
    <div class="toast" id="toast"></div>

</body>

</html>
